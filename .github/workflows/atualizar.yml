name: Atualizar dados

# Desligado em 17/10/2026: os dados agora são baixados pela VPS (vendas.moretta.com.br/metodo/).
# Ainda dá para rodar à mão em Actions → Atualizar dados → Run workflow.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/atualizar.py
      - name: Salvar dados novos
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dados.json setores.json
          git diff --cached --quiet || git commit -m "Dados de $(TZ=America/Sao_Paulo date +%d/%m/%Y)"
          git push
