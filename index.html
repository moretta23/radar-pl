<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mais Tempo: novo endereço</title>
<meta name="description" content="O app Método Tempo agora se chama Mais Tempo e fica em vendas.moretta.com.br/metodo/">
<meta name="theme-color" content="#000000">
<link rel="icon" href="app/icons/favicon.png" sizes="48x48" type="image/png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;800;900&family=Permanent+Marker&display=swap">
<style>
/* Aviso de mudança: este endereço (GitHub Pages) foi substituído pela VPS. */
:root { --bg: #0A0A0A; --surface: #151515; --fg: #F4EFE6; --muted: #9C968B; --line: #2A2A2A;
  --laranja: #F6B651; --verde: #74D352; color-scheme: dark; }
* { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px 16px;
  background: var(--bg); color: var(--fg); font: 600 16px/1.5 "Nunito", system-ui, sans-serif; }
main { width: 100%; max-width: 420px; background: var(--surface); border: 1px solid var(--line);
  border-radius: 20px; padding: 32px 24px; text-align: center; }
img { width: 84px; height: 84px; border-radius: 20px; }
h1 { font: 400 28px/1.2 "Permanent Marker", cursive; color: var(--laranja); margin: 18px 0 8px; }
p { margin: 0 0 12px; color: var(--muted); }
.end { font-weight: 600; color: var(--fg); word-break: break-all; }
a.botao { display: block; margin: 22px 0 18px; padding: 15px; border-radius: 12px; background: var(--verde);
  color: #000; font-weight: 900; text-decoration: none; font-size: 17px; }
small { display: block; color: var(--muted); font-size: 14px; text-align: left; border-top: 1px solid var(--line); padding-top: 14px; }
</style>
</head>
<body>
<main>
  <img src="app/icons/icon-192.png" alt="">
  <h1>O app agora é Mais Tempo e mudou de endereço</h1>
  <p>O app agora fica em</p>
  <p class="end">vendas.moretta.com.br/metodo</p>
  <a class="botao" href="https://vendas.moretta.com.br/metodo/">Abrir o Mais Tempo</a>
  <small>Se você instalou o app no celular, apague o ícone antigo e instale de novo a partir do novo endereço.
    Este endereço não recebe mais dados novos.</small>
</main>
<script>
// Remove o app antigo guardado no celular, para este aviso aparecer sempre.
if ("serviceWorker" in navigator) {
  navigator.serviceWorker.getRegistrations().then(rs => rs.forEach(r => r.unregister())).catch(() => {});
}
if (window.caches) caches.keys().then(ks => ks.forEach(k => caches.delete(k))).catch(() => {});
</script>
</body>
</html>
