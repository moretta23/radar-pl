<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Método Tempo mudou de endereço</title>
<meta name="description" content="O app Método Tempo agora fica em vendas.moretta.com.br/metodo/">
<meta name="theme-color" content="#0a3a28">
<link rel="icon" href="app/icons/favicon.png" sizes="48x48" type="image/png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Public+Sans:wght@400;500;600&display=swap">
<style>
/* Aviso de mudança: este endereço (GitHub Pages) foi substituído pela VPS. */
:root { --bg: #f3f5f2; --surface: #fff; --fg: #142019; --muted: #5d6b62; --line: #dde3dd; --accent: #0b7a4b; }
@media (prefers-color-scheme: dark) {
  :root { --bg: #0e1411; --surface: #16201b; --fg: #e8eee9; --muted: #9aa89f; --line: #27332c; --accent: #4fd08f; }
}
* { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px 16px;
  background: var(--bg); color: var(--fg); font: 16px/1.5 "Public Sans", system-ui, sans-serif; }
main { width: 100%; max-width: 420px; background: var(--surface); border: 1px solid var(--line);
  border-radius: 20px; padding: 32px 24px; text-align: center; }
img { width: 84px; height: 84px; border-radius: 20px; }
h1 { font: 700 30px/1.1 "Barlow Condensed", sans-serif; margin: 18px 0 8px; }
p { margin: 0 0 12px; color: var(--muted); }
.end { font-weight: 600; color: var(--fg); word-break: break-all; }
a.botao { display: block; margin: 22px 0 18px; padding: 15px; border-radius: 12px; background: var(--accent);
  color: #fff; font-weight: 600; text-decoration: none; font-size: 17px; }
@media (prefers-color-scheme: dark) { a.botao { color: #0e1411; } }
small { display: block; color: var(--muted); font-size: 14px; text-align: left; border-top: 1px solid var(--line); padding-top: 14px; }
</style>
</head>
<body>
<main>
  <img src="app/icons/icon-192.png" alt="">
  <h1>O Método Tempo mudou de endereço</h1>
  <p>O app agora fica em</p>
  <p class="end">vendas.moretta.com.br/metodo</p>
  <a class="botao" href="https://vendas.moretta.com.br/metodo/">Abrir o novo Método Tempo</a>
  <small>Se você instalou o app no celular, apague o ícone antigo e instale de novo a partir do novo endereço.
    Este endereço não recebe mais dados novos.</small>
</main>
<script>
// Remove o app antigo guardado no celular, para este aviso aparecer sempre.
if ("serviceWorker" in navigator) {
  navigator.serviceWorker.getRegistrations().then(rs => rs.forEach(r => r.unregister())).catch(() => {});
}
if (window.caches) caches.keys().then(ks => ks.forEach(k => caches.delete(k))).catch(() => {});
</script>
</body>
</html>
