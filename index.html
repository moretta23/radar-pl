<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Método Tempo</title>
<meta name="description" content="Ações da B3 com P/L até 7, com dados do Fundamentus.">
<meta name="theme-color" content="#f3f5f2" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0e1411" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" sizes="192x192" type="image/png">
<link rel="icon" href="icons/favicon.png" sizes="48x48" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Public+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: uma coluna de fichas de ativo, com régua de P/L em cada uma; filtros fixos no topo. */
:root {
  --bg: #f3f5f2; --surface: #ffffff; --fg: #142019; --muted: #5d6b62; --line: #dde3dd;
  --accent: #0b7a4b; --track: #e7ece7; --warn: #a35a00;
  --f-display: "Barlow Condensed", "Arial Narrow", system-ui, sans-serif;
  --f-body: "Public Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0e1411; --surface: #161e19; --fg: #e4ece6; --muted: #93a39a; --line: #26322b;
    --accent: #3fcf8a; --track: #223029; --warn: #f0a650; color-scheme: dark;
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--fg); font-family: var(--f-body); font-size: 15px;
  -webkit-tap-highlight-color: transparent; }
.wrap { max-width: 640px; margin: 0 auto; padding-inline: 16px; padding-block: 0 calc(40px + env(safe-area-inset-bottom, 0px)); }

header.top {
  background: var(--bg);
  padding-block: calc(14px + env(safe-area-inset-top, 0px)) 10px;
  border-bottom: 1px solid var(--line); display: grid; gap: 10px;
}
.titulo { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.marca { display: flex; align-items: center; gap: 10px; }
.marca img { width: 40px; height: 40px; border-radius: 10px; }
.nomeapp { display: grid; gap: 2px; }
.eyebrow { font-size: .68rem; font-weight: 600; text-transform: uppercase; letter-spacing: .14em; color: var(--muted); }
h1 { font-family: var(--f-display); font-weight: 700; font-size: 1.9rem; margin: 0; line-height: 1; }
h1 span { color: var(--accent); }
.contagem { font-family: var(--f-display); font-size: 1.05rem; color: var(--muted); white-space: nowrap; text-align: right; }
.contagem b { color: var(--fg); font-size: 1.4rem; font-weight: 600; }

.busca { width: 100%; font: inherit; font-size: 16px; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); color: var(--fg); }
.linha { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.rot { font-size: .72rem; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
select, .chip { font: inherit; font-size: .85rem; padding: 6px 10px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); color: var(--fg); }
.chip { cursor: pointer; display: inline-flex; gap: 6px; align-items: center; }
.chip input { accent-color: var(--accent); margin: 0; }
.slider { display: flex; align-items: center; gap: 10px; flex: 1 1 100%; }
.slider label.rot { flex: none; width: 7.4em; }
.slider input { flex: 1; accent-color: var(--accent); }
.slider output { font-family: var(--f-display); font-weight: 600; font-size: 1.15rem; min-width: 4.2ch; text-align: right; font-variant-numeric: tabular-nums; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.lista { list-style: none; margin: 14px 0 0; padding: 0; display: grid; gap: 8px; }
.ficha { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; display: grid; gap: 8px; }
.cab { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
.id { min-width: 0; }
.ticker { font-family: var(--f-display); font-weight: 700; font-size: 1.35rem; letter-spacing: .03em; color: var(--fg); text-decoration: none; }
.nome { font-size: .78rem; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pl { text-align: right; flex: none; }
.pl .v { font-family: var(--f-display); font-weight: 700; font-size: 1.6rem; color: var(--accent); line-height: 1; font-variant-numeric: tabular-nums; }
.pl .k { font-size: .66rem; text-transform: uppercase; letter-spacing: .1em; color: var(--muted); }
.regua { height: 4px; background: var(--track); border-radius: 2px; overflow: hidden; }
.regua i { display: block; height: 100%; background: var(--accent); border-radius: 2px; }
.metr { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px 6px; margin: 0; }
.metr div { display: grid; gap: 1px; }
.metr dt { font-size: .64rem; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
.metr dd { margin: 0; font-family: var(--f-display); font-weight: 500; font-size: 1.05rem; font-variant-numeric: tabular-nums; }
.metr dd.neg { color: var(--warn); }
.aviso { text-align: center; color: var(--muted); padding: 40px 0; line-height: 1.5; }
footer { margin-top: 20px; font-size: .78rem; color: var(--muted); line-height: 1.5; }
footer a { color: var(--accent); }
.grupo { display: inline-flex; align-items: center; gap: 6px; }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="titulo">
      <div class="marca">
        <img src="icons/icon-192.png" alt="">
        <div class="nomeapp">
          <div class="eyebrow">Método Tempo</div>
          <h1>P/L <span>≤ <span id="maxTxt">7</span></span></h1>
        </div>
      </div>
      <div class="contagem"><b id="qtd">–</b> empresas</div>
    </div>
    <input id="busca" class="busca" type="search" placeholder="Buscar ticker ou empresa" aria-label="Buscar ticker ou empresa">
    <div class="linha">
      <div class="slider">
        <label class="rot" for="max">P/L máx.</label>
        <input id="max" type="range" min="1" max="15" step="0.5" value="7">
        <output id="maxOut" for="max">7</output>
      </div>
      <div class="slider">
        <label class="rot" for="pvpMin">P/VP mín.</label>
        <input id="pvpMin" type="range" min="0" max="5" step="0.1" value="0">
        <output id="pvpMinOut" for="pvpMin">livre</output>
      </div>
      <div class="slider">
        <label class="rot" for="pvpMax">P/VP máx.</label>
        <input id="pvpMax" type="range" min="0" max="5" step="0.1" value="5">
        <output id="pvpMaxOut" for="pvpMax">livre</output>
      </div>
      <div class="slider">
        <label class="rot" for="divMax">Dív/PL máx.</label>
        <input id="divMax" type="range" min="0" max="1" step="0.1" value="0.5">
        <output id="divMaxOut" for="divMax">0,5</output>
      </div>
      <div class="slider">
        <label class="rot" for="roeMin">ROE mín.</label>
        <input id="roeMin" type="range" min="0" max="40" step="1" value="0">
        <output id="roeMinOut" for="roeMin">livre</output>
      </div>
      <div class="slider">
        <label class="rot" for="mrgMin">Margem mín.</label>
        <input id="mrgMin" type="range" min="0" max="40" step="1" value="0">
        <output id="mrgMinOut" for="mrgMin">livre</output>
      </div>
    </div>
    <div class="linha">
      <span class="grupo"><label class="rot" for="ordem">Ordem</label>
      <select id="ordem">
        <option value="pl">Menor P/L</option>
        <option value="dy">Maior Div. Yield</option>
        <option value="roe">Maior ROE</option>
        <option value="mrg_liq">Maior margem líquida</option>
        <option value="liq2m">Maior liquidez</option>
        <option value="pvp">Menor P/VP</option>
      </select></span>
      <span class="grupo"><label class="rot" for="liq">Liquidez</label>
      <select id="liq">
        <option value="0">Todas</option>
        <option value="100000" selected>≥ R$ 100 mil/dia</option>
        <option value="1000000">≥ R$ 1 mi/dia</option>
        <option value="10000000">≥ R$ 10 mi/dia</option>
      </select></span>
      <label class="chip"><input id="pos" type="checkbox" checked> Só P/L positivo</label>
    </div>
  </header>

  <ul id="lista" class="lista"></ul>
  <p id="aviso" class="aviso">Carregando dados…</p>

  <footer>
    Dados de <a href="https://www.fundamentus.com.br/resultado.php" target="_blank" rel="noopener">fundamentus.com.br</a>,
    capturados em <span id="data">—</span>. Atualizados todo dia útil à noite.
    Liquidez = volume médio diário dos últimos 2 meses. Não é recomendação de investimento.
  </footer>
</div>

<script>
const $ = id => document.getElementById(id);
let acoes = [];

const fmt = (v, d = 2) => v == null ? "—" : v.toLocaleString("pt-BR", { minimumFractionDigits: d, maximumFractionDigits: d });
const pct = v => v == null ? "—" : fmt(v, 1) + "%";
function liqFmt(v) {
  if (v == null) return "—";
  if (v >= 1e9) return fmt(v / 1e9, 1) + " bi";
  if (v >= 1e6) return fmt(v / 1e6, 1) + " mi";
  if (v >= 1e3) return fmt(v / 1e3, 0) + " mil";
  return fmt(v, 0);
}
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);

const ctrl = ["busca", "max", "pvpMin", "pvpMax", "divMax", "roeMin", "mrgMin", "ordem", "liq", "pos"];
const PVP_TOPO = 5; // P/VP máx. no fim da barra = sem limite
try {
  const s = JSON.parse(localStorage.getItem("radar-pl") || "{}");
  ctrl.forEach(k => { if (s[k] != null) { if (k === "pos") $(k).checked = s[k]; else $(k).value = s[k]; } });
} catch (e) {}

function render() {
  const max = parseFloat($("max").value);
  const q = $("busca").value.trim().toLowerCase();
  const liq = parseFloat($("liq").value);
  const pos = $("pos").checked;
  const ord = $("ordem").value;
  const maxStr = fmt(max, max % 1 ? 1 : 0);
  $("maxOut").textContent = maxStr;
  $("maxTxt").textContent = maxStr;
  const pvpMin = parseFloat($("pvpMin").value);
  const pvpMax = parseFloat($("pvpMax").value);
  const semMin = pvpMin <= 0, semMax = pvpMax >= PVP_TOPO;
  $("pvpMinOut").textContent = semMin ? "livre" : fmt(pvpMin, 1);
  $("pvpMaxOut").textContent = semMax ? "livre" : fmt(pvpMax, 1);
  const divMax = parseFloat($("divMax").value);
  $("divMaxOut").textContent = fmt(divMax, 1);
  // ROE e margem em %; 0 = sem filtro.
  const roeMin = parseFloat($("roeMin").value);
  const mrgMin = parseFloat($("mrgMin").value);
  $("roeMinOut").textContent = roeMin > 0 ? roeMin + "%" : "livre";
  $("mrgMinOut").textContent = mrgMin > 0 ? mrgMin + "%" : "livre";
  try {
    const s = {};
    ctrl.forEach(k => { s[k] = k === "pos" ? $(k).checked : $(k).value; });
    localStorage.setItem("radar-pl", JSON.stringify(s));
  } catch (e) {}
  if (!acoes.length) return;

  // Com qualquer limite de P/VP ativo, fica de fora P/VP negativo (patrimônio negativo).
  const pvpOk = a => (semMin && semMax) ||
    (a.pvp != null && a.pvp > 0 && (semMin || a.pvp >= pvpMin) && (semMax || a.pvp <= pvpMax));
  const r = acoes.filter(a => a.pl != null && a.pl <= max && (!pos || a.pl > 0) && (a.liq2m || 0) >= liq &&
    pvpOk(a) && a.div_pl != null && a.div_pl <= divMax + 1e-9 &&
    (roeMin <= 0 || (a.roe != null && a.roe >= roeMin)) &&
    (mrgMin <= 0 || (a.mrg_liq != null && a.mrg_liq >= mrgMin)) && (!q || a.t.toLowerCase().includes(q) || a.n.toLowerCase().includes(q)));
  const asc = ord === "pl" || ord === "pvp";
  r.sort((a, b) => {
    const x = a[ord], y = b[ord];
    if (x == null) return 1; if (y == null) return -1;
    return asc ? x - y : y - x;
  });

  $("qtd").textContent = r.length;
  $("aviso").hidden = r.length > 0;
  $("aviso").textContent = "Nenhuma empresa com esses filtros.";
  $("lista").innerHTML = r.map(a => {
    const w = Math.max(2, Math.min(100, (a.pl / max) * 100));
    return `<li class="ficha">
      <div class="cab">
        <div class="id">
          <a class="ticker" href="https://www.fundamentus.com.br/detalhes.php?papel=${encodeURIComponent(a.t)}" target="_blank" rel="noopener">${esc(a.t)}</a>
          <div class="nome">${esc(a.n)}</div>
        </div>
        <div class="pl"><div class="v">${fmt(a.pl)}</div><div class="k">P/L · R$ ${fmt(a.cotacao)}</div></div>
      </div>
      <div class="regua" aria-hidden="true"><i style="width:${a.pl > 0 ? w : 0}%"></i></div>
      <dl class="metr">
        <div><dt>Div. Yield</dt><dd>${pct(a.dy)}</dd></div>
        <div><dt>P/VP</dt><dd>${fmt(a.pvp)}</dd></div>
        <div><dt>ROE</dt><dd class="${a.roe < 0 ? "neg" : ""}">${pct(a.roe)}</dd></div>
        <div><dt>Mrg. líq.</dt><dd class="${a.mrg_liq < 0 ? "neg" : ""}">${pct(a.mrg_liq)}</dd></div>
        <div><dt>Dív/PL</dt><dd>${fmt(a.div_pl)}</dd></div>
        <div><dt>Liq. 2m</dt><dd>${liqFmt(a.liq2m)}</dd></div>
      </dl>
    </li>`;
  }).join("");
}

async function carregar() {
  try {
    const resp = await fetch("dados.json", { cache: "no-cache" });
    if (!resp.ok) throw new Error(resp.status);
    const dados = await resp.json();
    acoes = dados.acoes || [];
    $("data").textContent = dados.atualizado || "—";
    render();
  } catch (e) {
    $("aviso").textContent = "Não foi possível carregar os dados. Verifique a internet e abra o app de novo.";
  }
}

ctrl.forEach(k => $(k).addEventListener("input", render));
// O mínimo nunca passa do máximo: arrastar um empurra o outro.
$("pvpMin").addEventListener("input", () => {
  if (+$("pvpMin").value > +$("pvpMax").value) { $("pvpMax").value = $("pvpMin").value; render(); }
}, true);
$("pvpMax").addEventListener("input", () => {
  if (+$("pvpMax").value < +$("pvpMin").value) { $("pvpMin").value = $("pvpMax").value; render(); }
}, true);
render();
carregar();
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
</script>
</body>
</html>
